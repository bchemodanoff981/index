<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор электрической тяги</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:18px;background:#f4f6f8;color:#17202a}
.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-weight:700}
input{box-sizing:border-box;width:100%;margin-top:7px;padding:11px;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:9px;font-size:18px;font-weight:700;cursor:pointer}
.result{font-size:30px;font-weight:800}
.error{padding:12px;border-radius:8px;background:#ffe1e1}
.small{font-size:13px;color:#555}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h1>Калькулятор пригодности воздушного судна к электрической тяге</h1>
<p>Учебная модель: рассчитывает условный индекс <b>Kэл</b> от 0 до 100.</p>
</div>

<div class="card">
<h2>Данные воздушного судна</h2>
<div class="grid">
<div><label>Максимальная взлётная масса, кг<input id="mtow" type="number" value="3000" min="1"></label></div>
<div><label>Дальность, км<input id="range" type="number" value="200" min="1"></label></div>
<div><label>Крейсерская скорость, км/ч<input id="speed" type="number" value="200" min="1"></label></div>
<div><label>Средняя требуемая мощность, кВт<input id="power" type="number" value="120" min="1"></label></div>
<div><label>Доля маршрута на электротяге, %<input id="share" type="number" value="100" min="1" max="100"></label></div>
<div><label>Удельная энергоёмкость батареи, Вт·ч/кг<input id="spec" type="number" value="250" min="1"></label></div>
</div>
</div>

<div class="card">
<h2>Настройки индекса</h2>
<div class="grid">
<div><label>Допустимая доля батареи от MTOW, %<input id="limit" type="number" value="20" min="1" max="100"></label></div>
<div><label>Вес массы<input id="wm" type="number" value="0.50" min="0" max="1" step="0.05"></label></div>
<div><label>Вес энергии<input id="we" type="number" value="0.30" min="0" max="1" step="0.05"></label></div>
<div><label>Вес дальности<input id="wr" type="number" value="0.20" min="0" max="1" step="0.05"></label></div>
</div>
<p class="small">Весовые коэффициенты должны в сумме давать 1,00.</p>
</div>

<div class="card">
<button id="calcBtn" type="button">Рассчитать</button>
<div id="out" style="margin-top:18px"></div>
</div>

<script>
(function(){
"use strict";
function getNum(id){ return parseFloat(document.getElementById(id).value); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

function calc(){
  const mtow=getNum("mtow"), range=getNum("range"), speed=getNum("speed"),
        power=getNum("power"), share=getNum("share")/100, spec=getNum("spec"),
        limit=getNum("limit")/100, wm=getNum("wm"), we=getNum("we"), wr=getNum("wr");
  const out=document.getElementById("out");

  if([mtow,range,speed,power,share,spec,limit,wm,we,wr].some(v=>!Number.isFinite(v))){
    out.innerHTML='<div class="error">Проверьте: все поля должны содержать числа.</div>'; return;
  }
  if(share<=0 || share>1 || spec<=0 || limit<=0){
    out.innerHTML='<div class="error">Проверьте диапазон введённых значений.</div>'; return;
  }

  const sum=wm+we+wr;
  if(Math.abs(sum-1)>0.0001){
    out.innerHTML='<div class="error"><b>Ошибка:</b> веса должны в сумме давать 1,00. Сейчас '+sum.toFixed(2)+'.</div>'; return;
  }

  const timeH=(range/speed)*share;
  const energy=power*timeH;
  const batteryKg=energy*1000/spec;
  const massFraction=batteryKg/mtow;

  const massScore=clamp((1-massFraction/limit)*100,0,100);
  const energyScore=clamp(100*(1-energy/(mtow*spec/1000)),0,100);
  const rangeScore=clamp(100*(1-(range-100)/900),0,100);
  const K=wm*massScore+we*energyScore+wr*rangeScore;

  let category;
  if(K>=80) category="высокая расчётная пригодность";
  else if(K>=60) category="средняя расчётная пригодность";
  else if(K>=40) category="ограниченная пригодность";
  else category="низкая расчётная пригодность";

  out.innerHTML=
    '<div class="result">Kэл = '+K.toFixed(1)+' / 100</div>'+
    '<p><b>'+category+'</b></p><hr>'+
    '<p>Время электрического участка: <b>'+timeH.toFixed(2)+' ч</b></p>'+
    '<p>Требуемая энергия: <b>'+energy.toFixed(1)+' кВт·ч</b></p>'+
    '<p>Расчётная масса аккумуляторных ячеек: <b>'+batteryKg.toFixed(1)+' кг</b></p>'+
    '<p>Доля массы аккумулятора от MTOW: <b>'+(massFraction*100).toFixed(1)+'%</b></p>'+
    '<p>Баллы: масса '+massScore.toFixed(1)+', энергия '+energyScore.toFixed(1)+', дальность '+rangeScore.toFixed(1)+'</p>'+
    '<p class="small">Это учебный индекс, а не официальный авиационный коэффициент и не доказательство возможности сертификации.</p>';
}

document.getElementById("calcBtn").addEventListener("click",calc);
window.addEventListener("load",calc);
})();
</script>
</body>
</html>
